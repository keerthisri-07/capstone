version: '3.9'

services:
  # ─── MongoDB ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: suraksha_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: suraksha_db
    volumes:
      - mongo_data:/data/db
    networks:
      - suraksha_net

  # ─── ChromaDB ────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: suraksha_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - suraksha_net

  # ─── Backend (FastAPI) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suraksha_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - CHROMADB_ENABLED=true
    depends_on:
      - mongodb
      - chromadb
    volumes:
      - ./backend:/app
    networks:
      - suraksha_net

  # ─── Frontend (Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suraksha_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - suraksha_net

  # ─── n8n Automation ──────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: suraksha_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=suraksha2024
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - suraksha_net

volumes:
  mongo_data:
  chroma_data:
  n8n_data:

networks:
  suraksha_net:
    driver: bridge
